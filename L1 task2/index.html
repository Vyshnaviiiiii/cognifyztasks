<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LEVEL 1 TASK 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>LEVEL 1 TASK 2</h1>

    <!-- Button Color Change -->
    <section>
        <h3>Button Color Change</h3>
        <button id="colorBtn">Click Me</button>
    </section>

    <!-- Greeting Alert -->
    <section>
        <h3>Greeting Alert</h3>
        <button id="greetBtn">Show Greeting</button>
    </section>

    <!-- Calculator -->
    <section>
        <h3>Simple Calculator</h3>
        <input type="number" id="num1" placeholder="Number 1">
        <input type="number" id="num2" placeholder="Number 2">
        <br><br>
        <button id="addBtn">Add</button>
        <p id="result"></p>
    </section>

    <script src="script.js"></script>
</body>
</html>
