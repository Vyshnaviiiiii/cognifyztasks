<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 2 Task 1</title>

    <!-- Bulma CSS (for card) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

    <!-- Bootstrap CSS (for grid) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }
        hr {
            margin: 50px 0;
        }
    </style>
</head>
<body>

<!-- ================= BULMA CARD SECTION ================= -->

<section class="section">
    <div class="container">

        <h1 class="title has-text-centered">
            Responsive Card (Bulma)
        </h1>

        <div class="columns is-centered">
            <div class="column is-4">

                <div class="card">
                    <div class="card-image">
                        <figure class="image is-4by3">
                            <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93"
                                 alt="Coffee">
                        </figure>
                    </div>

                    <div class="card-content">
                        <p class="title is-5">The Velvet Mugs</p>
                        <p class="content">
                            A cozy café serving freshly brewed coffee
                            in a warm and welcoming environment.
                        </p>
                    </div>
                </div>

            </div>
        </div>

    </div>
</section>

<hr>

<!-- ================= BOOTSTRAP GRID SECTION ================= -->

<div class="container text-center">

    <h1 class="mb-4">
        Responsive Grid (Bootstrap)
    </h1>

    <div class="row">
        <div class="col-md-4 col-sm-12 mb-3">
            <div class="p-3 border rounded bg-white">
                <h4>Coffee</h4>
                <p>Hot and cold brews</p>
            </div>
        </div>

        <div class="col-md-4 col-sm-12 mb-3">
            <div class="p-3 border rounded bg-white">
                <h4>Tea</h4>
                <p>Herbal and classic teas</p>
            </div>
        </div>

        <div class="col-md-4 col-sm-12 mb-3">
            <div class="p-3 border rounded bg-white">
                <h4>Desserts</h4>
                <p>Cakes and pastries</p>
            </div>
        </div>
    </div>

</div>

</body>
</html>
